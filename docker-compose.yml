services:

  backend:
    build:
      context: ./backend
    container_name: realtime-chat-backend
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    networks:
      - chat-network

  frontend:
    build:
      context: ./frontend
    container_name: realtime-chat-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - chat-network

networks:
  chat-network:
    driver: bridge